name: CI

# Two levels (scripts/ci-plan.sh decides, docs/SETUP.md explains):
#   quick  Linux only, with the database servers only when providers or the SSH tunnel changed;
#   full   Windows + Linux with every server (macOS is paused since 2026-11-24: add it with the `macos`
#          input of the manual dispatch or "[macos-ci]" in the commit message or PR title): manual dispatch, "[full-ci]" in the commit
#          message or PR title, pull requests, and changes to the build, dependency or packaging setup.
# Closing a milestone is a full run (CLAUDE.md). Pushes that only touch documentation run nothing:
# a push that mixes docs and code does run, because GitHub looks at every file of the push.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  # Full run on demand: Actions tab -> CI -> Run workflow. "full" also makes clang-tidy analyse
  # every file, not only the changed ones.
  workflow_dispatch:
    inputs:
      full:
        description: 'Run clang-tidy on every file, not only on the changed ones'
        type: boolean
        default: true
      macos:
        description: 'Include the macOS builds and the universal .dmg (paused by default)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.plan.outputs.full }}
      servers: ${{ steps.plan.outputs.servers }}
      macos: ${{ steps.plan.outputs.macos }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff against the previous push
      - id: plan
        env:
          FORCED: ${{ (github.event_name == 'workflow_dispatch') || contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.pull_request.title, '[full-ci]') }}
          MACOS: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos) || contains(github.event.head_commit.message, '[macos-ci]') || contains(github.event.pull_request.title, '[macos-ci]') }}
        run: |
          bash scripts/ci-plan.sh "${{ github.event_name }}" "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}" "$FORCED" "$MACOS" | tee -a "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      # Own vcpkg checkout: the image's copy may predate vcpkg.json's builtin-baseline.
      # Inside the workspace (gitignored): upload-artifact rejects paths containing '..'.
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-tool
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # clang-tidy diffs against the previous push

      - name: Restore Qt
        uses: actions/cache@v6
        with:
          path: ${{ matrix.qt_dir }}
          key: qt-${{ runner.os }}-${{ hashFiles('.qt-version', 'scripts/requirements-aqt.txt') }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**', '.qt-version') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Create vcpkg cache dir
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      # ccache for the C++ compiles (macOS and Linux; MSVC is not worth the setup). Keyed on the commit
      # so every run saves its objects, and restored from the newest earlier one.
      - name: Restore ccache (macOS / Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-

      # One apt-get for everything Linux needs from the distribution: each call costs minutes on the
      # runner (package index, triggers). ccache; a headless keyring for the keychain tests; sshd only
      # when the tunnel tests run.
      - name: Install ccache and the Linux packages (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            packages="ccache gnome-keyring dbus-x11"
            if [ "${{ needs.plan.outputs.servers }}" = "true" ]; then packages="$packages openssh-server"; fi
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $packages
          else
            brew install ccache
          fi
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -NonInteractive -SkipCompiler

      - name: Setup (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./scripts/setup.sh --non-interactive

      - name: Configure, build, test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset ${{ matrix.preset }} -DQUARRY_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset ${{ matrix.preset }} --output-on-failure -E '^tst_controls$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The QML suite times the UI on a shared runner: a timing flake gets one more try, a real
          # failure fails twice.
          ctest --preset ${{ matrix.preset }} --output-on-failure -R '^tst_controls$' --repeat until-pass:2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Packaging check (H10): install into a clean prefix and start quarry from there with a minimal
      # PATH, so a DLL that only resolves through the build tree or Qt's bin directory fails here.
      - name: Install and smoke-test the package tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --build --preset ${{ matrix.preset }} --target quarry_deploy_probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $prefix = Join-Path $env:RUNNER_TEMP 'quarry'
          cmake --install build/${{ matrix.preset }} --prefix $prefix
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $bytes = (Get-ChildItem $prefix -Recurse -File | Measure-Object Length -Sum).Sum
          $zip = Join-Path $env:RUNNER_TEMP 'quarry-tree.zip'
          Compress-Archive -Path "$prefix\*" -DestinationPath $zip -CompressionLevel Optimal
          "Installed tree: {0:N1} MB; zip {1:N1} MB" -f ($bytes / 1MB), ((Get-Item $zip).Length / 1MB)
          # The offscreen platform plugin is for this test only, it is not part of the package.
          $qt6Dir = ((Select-String -Path build/${{ matrix.preset }}/CMakeCache.txt -Pattern '^Qt6_DIR:').Line -split '=', 2)[1]
          $qtPlatforms = Join-Path $qt6Dir '..\..\..\plugins\platforms'
          Copy-Item (Join-Path $qtPlatforms 'qoffscreen.dll') "$prefix\bin\platforms\"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'quarry-appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "$prefix\bin\quarry.exe" -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'quarry --smoke from the installed tree timed out' }
          if ($p.ExitCode -ne 0) { throw "quarry --smoke from the installed tree exited with $($p.ExitCode)" }
          Remove-Item "$prefix\bin\platforms\qoffscreen.dll"
          Copy-Item $zip (Join-Path $env:GITHUB_WORKSPACE 'quarry-windows-tree.zip')

      - name: Upload the installed tree (Windows, unsigned, for manual checks)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-windows-tree
          path: quarry-windows-tree.zip
          retention-days: 3

      # Windows packages (H10 phase 2): the Inno Setup installer and the MSIX, built from the tree
      # installed above. The MSIX is signed with a throwaway certificate of this run so that it can
      # be installed for testing (its public .cer is uploaded; the private key never leaves the job).
      # The installer is installed silently, quarry --smoke runs from there, and it is uninstalled.
      - name: Build and test the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $prefix = Join-Path $env:RUNNER_TEMP 'quarry'
          $out = Join-Path $env:RUNNER_TEMP 'installers'
          ./packaging/windows/build_installers.ps1 -TreeDir $prefix -OutDir $out -TestSign
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = Get-ChildItem $out -Filter 'Quarry-*-x64-setup.exe' | Select-Object -First 1

          $dir = Join-Path $env:RUNNER_TEMP 'quarry-from-installer'
          $p = Start-Process -FilePath $setup.FullName -PassThru -Wait `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/NOICONS', "/DIR=`"$dir`""
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          if (-not (Test-Path "$dir\bin\quarry.exe")) { throw 'the installer did not install bin\quarry.exe' }
          # The offscreen platform plugin is for this test only, it is not part of the package.
          $qt6Dir = ((Select-String -Path build/${{ matrix.preset }}/CMakeCache.txt -Pattern '^Qt6_DIR:').Line -split '=', 2)[1]
          Copy-Item (Join-Path $qt6Dir '..\..\..\plugins\platforms\qoffscreen.dll') "$dir\bin\platforms\"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'quarry-installer-appdata'
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $env:QT_QPA_PLATFORM = 'offscreen'
          $q = Start-Process -FilePath "$dir\bin\quarry.exe" -ArgumentList '--smoke' -PassThru
          if (-not $q.WaitForExit(90000)) { $q.Kill(); throw 'quarry --smoke from the installed package timed out' }
          if ($q.ExitCode -ne 0) { throw "quarry --smoke from the installed package exited with $($q.ExitCode)" }
          Remove-Item "$dir\bin\platforms\qoffscreen.dll"
          $u = Start-Process -FilePath "$dir\unins000.exe" -PassThru -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($u.ExitCode -ne 0) { throw "the uninstaller exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $dir) { throw "the uninstaller left $dir behind" }
          Copy-Item "$out\*" $env:GITHUB_WORKSPACE

      - name: Upload the Windows installer (unsigned)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-windows-installer
          path: Quarry-*-x64-setup.exe
          retention-days: 3

      - name: Upload the MSIX and its test certificate (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-windows-msix
          path: |
            Quarry-*-x64.msix
            Quarry-test.cer
          retention-days: 3

      # PostgreSQL conformance (H1.8). A docker step, not `services:`, because this is a matrix
      # job and service containers only work on Linux runners.
      - name: Start PostgreSQL 17 (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=quarry -e POSTGRES_PASSWORD=quarry             -e POSTGRES_DB=quarry_test postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U quarry -d quarry_test && break; sleep 1; done
          echo "QUARRY_TEST_POSTGRES_URL=postgresql://quarry:quarry@localhost:5432/quarry_test" >> "$GITHUB_ENV"

      # MySQL / MariaDB conformance (H6). MariaDB 11 on port 3306 is the default target of
      # tst_mysql_provider; MySQL 8.4 (caching_sha2_password) on 3307 gets its own run below.
      - name: Start MariaDB 11 and MySQL 8.4 (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        run: |
          docker run -d --name maria -p 3306:3306 -e MARIADB_ROOT_PASSWORD=quarry -e MARIADB_DATABASE=quarry_test mariadb:11
          docker run -d --name mysql84 -p 3307:3306 -e MYSQL_ROOT_PASSWORD=quarry -e MYSQL_DATABASE=quarry_test mysql:8.4
          for i in $(seq 1 90); do docker exec maria mariadb-admin ping -uroot -pquarry --silent && break; sleep 1; done
          for i in $(seq 1 90); do docker exec mysql84 mysqladmin ping -uroot -pquarry --silent && break; sleep 1; done
          echo "QUARRY_TEST_MYSQL_URL=mysql://root:quarry@127.0.0.1:3306/quarry_test" >> "$GITHUB_ENV"

      # ODBC and SQL Server conformance (H7). unixODBC reads odbcinst.ini from /etc through
      # ODBCSYSINI (the vcpkg copy would look under its own prefix). `odbc` runs against the
      # postgres container with psqlodbc; `mssql` against SQL Server 2022 with msodbcsql18.
      - name: Install ODBC drivers (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        run: |
          # the package index was refreshed by the install step above
          if ! apt-cache show msodbcsql18 >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
          fi
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends unixodbc msodbcsql18 odbc-postgresql
          odbcinst -q -d
          echo "ODBCSYSINI=/etc" >> "$GITHUB_ENV"
          # odbcinst.ini names the drivers by file name (psqlodbcw.so); the vcpkg unixODBC does not
          # search the system ODBC directory by itself.
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/odbc" >> "$GITHUB_ENV"
          echo "QUARRY_TEST_ODBC_URL=Driver={PostgreSQL Unicode};Server=127.0.0.1;Port=5432;Database=quarry_test;UID=quarry;PWD=quarry;sslmode=disable" >> "$GITHUB_ENV"

      - name: Start SQL Server 2022 (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        run: |
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e 'MSSQL_SA_PASSWORD=Quarry_Pw1!' mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 120); do docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Quarry_Pw1!' -Q 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          echo 'QUARRY_TEST_MSSQL_URL=mssql://sa:Quarry_Pw1!@127.0.0.1:1433/master?trustservercertificate=true' >> "$GITHUB_ENV"

      # SSH tunnel tests (H8): the runner's own sshd on port 2222 with password login and TCP
      # forwarding; the tests start their own echo server on the runner and reach it through the tunnel.
      - name: Start sshd (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        run: |
          sudo useradd -m -s /bin/bash quarry
          echo 'quarry:quarry' | sudo chpasswd
          printf '%s\n' 'Port 2222' 'ListenAddress 127.0.0.1' 'PasswordAuthentication yes' 'AllowTcpForwarding yes' 'PermitOpen any' | sudo tee /etc/ssh/sshd_config.d/00-quarry.conf >/dev/null
          sudo mkdir -p /run/sshd
          # 00-: OpenSSH keeps the first value it reads, and cloud images ship 50-cloud-init.conf with
          # PasswordAuthentication no.
          # Ubuntu 24.04 starts sshd through ssh.socket, which ignores Port: stop it and run sshd directly.
          sudo systemctl stop ssh.socket ssh 2>/dev/null || true
          sudo /usr/sbin/sshd
          up=0
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && up=1 && break; sleep 1; done
          [ "$up" = 1 ] || { echo 'sshd did not open port 2222'; sudo /usr/sbin/sshd -T | head -5; exit 1; }
          echo 'QUARRY_TEST_SSH_URL=ssh://quarry:quarry@127.0.0.1:2222' >> "$GITHUB_ENV"

      - name: Configure, build, test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --preset ${{ matrix.preset }} -DQUARRY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ${{ matrix.preset }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Real Secret Service for the keychain tests: unlocked gnome-keyring in a private D-Bus session.
            dbus-run-session -- bash -c 'echo ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && QUARRY_TEST_KEYCHAIN=1 ctest --preset ${{ matrix.preset }} --output-on-failure -E "^tst_controls$" && QUARRY_TEST_KEYCHAIN=1 ctest --preset ${{ matrix.preset }} --output-on-failure -R "^tst_controls$" --repeat until-pass:2'
          else
            ctest --preset ${{ matrix.preset }} --output-on-failure -E '^tst_controls$'
            # One more try for a timing flake of the QML suite; a real failure fails twice.
            ctest --preset ${{ matrix.preset }} --output-on-failure -R '^tst_controls$' --repeat until-pass:2
          fi

      # Packaging check (H10): the install rules work and the installed quarry starts. Relocatable
      # bundles (.app, AppImage) come with the macOS and Linux phases of H10.
      - name: Install and smoke-test the layout (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          prefix="$RUNNER_TEMP/quarry"
          cmake --install build/${{ matrix.preset }} --prefix "$prefix"
          du -sh "$prefix"
          qtdir=$(grep -m1 '^Qt6_DIR:' build/${{ matrix.preset }}/CMakeCache.txt | cut -d= -f2)
          vlib=$(ls -d "$PWD"/build/vcpkg_installed/*-quarry/lib | head -1)
          export LD_LIBRARY_PATH="$qtdir/../..:$vlib" DYLD_LIBRARY_PATH="$vlib" DYLD_FRAMEWORK_PATH="$qtdir/../.."
          APPDATA="$RUNNER_TEMP/quarry-appdata" XDG_DATA_HOME="$RUNNER_TEMP/quarry-data" XDG_CONFIG_HOME="$RUNNER_TEMP/quarry-config" \
            QT_QPA_PLATFORM=offscreen "$prefix/bin/quarry" --smoke
          test -d "$prefix/bin/plugins/quarry"
          ls "$prefix/bin/plugins/quarry"

      # macOS bundle (H10 phase 3), built on each architecture from the tree installed above. The
      # absolute RPATHs of the build are stripped, so the smoke test below only passes if the bundle
      # carries everything. The offscreen platform plugin is for the test only (it is not packaged);
      # a copy travels in the tarball for the jobs below.
      - name: Build the app bundle (macOS)
        if: runner.os == 'macOS' && needs.plan.outputs.full == 'true'
        run: |
          qt6dir=$(grep -m1 '^Qt6_DIR:' build/${{ matrix.preset }}/CMakeCache.txt | cut -d= -f2)
          qt="$qt6dir/../../.."
          vlib=$(ls -d "$PWD"/build/vcpkg_installed/*-quarry/lib | head -1)
          version=$(sed -n 's/^project(quarry VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          packaging/macos/make_app.sh "build/${{ matrix.preset }}" "$RUNNER_TEMP/app" "$version" "$qt" "$vlib"
          app="$RUNNER_TEMP/app/Quarry.app"
          lipo -archs "$app/Contents/MacOS/quarry"
          du -sh "$app"
          # Test copy with the offscreen plugin, signed ad hoc like the rest, and a bare environment.
          test_app="$RUNNER_TEMP/app-test/Quarry.app"
          rm -rf "$RUNNER_TEMP/app-test" && mkdir -p "$RUNNER_TEMP/app-test"
          ditto "$app" "$test_app"
          cp "$qt/plugins/platforms/libqoffscreen.dylib" "$test_app/Contents/PlugIns/platforms/"
          codesign --force --sign - "$test_app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          mkdir -p "$RUNNER_TEMP/home"
          set -o pipefail
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen "$test_app/Contents/MacOS/quarry" --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Providers available" "$RUNNER_TEMP/smoke.log" || echo "::warning::the bundle did not report its providers"
          test -f "$test_app/Contents/PlugIns/quarry/quarry_provider_sqlite.so"
          # What the bundle links: nothing may point outside of it (absolute paths, /Users, /opt).
          bad=$(otool -L "$test_app/Contents/MacOS/quarry" | tail -n +2 | awk '{print $1}' | grep -vE '^(@|/usr/lib/|/System/)' || true)
          if [ -n "$bad" ]; then echo "quarry links outside the bundle:"; echo "$bad"; exit 1; fi
          cp "$qt/plugins/platforms/libqoffscreen.dylib" "$RUNNER_TEMP/app/libqoffscreen.dylib"
          tar -czf "$RUNNER_TEMP/quarry-app.tar.gz" -C "$RUNNER_TEMP/app" Quarry.app libqoffscreen.dylib

      - name: Upload the app bundle (macOS)
        if: runner.os == 'macOS' && needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-app-${{ runner.arch }}
          path: ${{ runner.temp }}/quarry-app.tar.gz
          retention-days: 3

      # Linux packages (H10 phase 4): the AppImage, built from this job's Release build with the
      # official AppImage tools pinned by version and SHA-256 (packaging/linux/build_appimage.sh), and
      # tested the way a user's machine runs it: bare environment, every library resolved from the
      # bundle. The deployed AppDir goes to the Flatpak job; libqoffscreen.so (the offscreen platform,
      # for tests only) travels with it.
      - name: Build and test the AppImage (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.full == 'true'
        run: |
          qt6dir=$(grep -m1 '^Qt6_DIR:' build/${{ matrix.preset }}/CMakeCache.txt | cut -d= -f2)
          qt="$qt6dir/../../.."
          vlib=$(ls -d "$PWD"/build/vcpkg_installed/*-quarry/lib | head -1)
          version=$(sed -n 's/^project(quarry VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          packaging/linux/build_appimage.sh "build/${{ matrix.preset }}" "$RUNNER_TEMP/appimage" "$version" "$qt" "$vlib"
          appimage="$RUNNER_TEMP/appimage/Quarry-$version-x86_64.AppImage"
          # Copied before the test, and the uploads below run even if it fails: a broken package is
          # what one wants to download and look at.
          cp "$appimage" .
          stage="$RUNNER_TEMP/appdir-artifact"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -a "$RUNNER_TEMP/appimage/AppDir/usr" "$stage/usr"
          cp "$qt/plugins/platforms/libqoffscreen.so" "$stage/"
          tar -czf quarry-appdir.tar.gz -C "$stage" .
          packaging/linux/test_appimage.sh "$appimage" "$qt"

      - name: Upload the AppImage (Linux)
        if: always() && runner.os == 'Linux' && needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-linux-appimage
          path: Quarry-*-x86_64.AppImage
          retention-days: 3

      - name: Upload the deployed AppDir for the Flatpak job (Linux)
        if: always() && runner.os == 'Linux' && needs.plan.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: quarry-linux-appdir
          path: quarry-appdir.tar.gz
          retention-days: 1

      # After the uploads, so that an oversized package can still be downloaded and measured.
      - name: Check the AppImage size budget (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.full == 'true'
        run: |
          bytes=$(stat -c %s Quarry-*-x86_64.AppImage)
          echo "AppImage: $((bytes / 1048576)) MB (budget 70 MB)"
          [ "$bytes" -le $((70 * 1048576)) ]

      - name: MySQL 8.4 conformance (Linux)
        if: runner.os == 'Linux' && needs.plan.outputs.servers == 'true'
        env:
          QUARRY_TEST_MYSQL_URL: mysql://root:quarry@127.0.0.1:3307/quarry_test
        run: ctest --preset linux-release -R tst_mysql_provider --output-on-failure

      # Only the files changed since the previous push, unless a full run is asked for: manual
      # dispatch with "full", "[full-ci]" in the commit message or PR title,
      # a changed build/analysis setup or more than 40 changed sources (scripts/ci-tidy-files.sh).
      - name: clang-tidy
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.pull_request.title, '[full-ci]') }}
        run: |
          files=$(bash scripts/ci-tidy-files.sh "$BASE_SHA" "$HEAD_SHA" "$FULL")
          if [ -z "$files" ]; then
            echo "No C++ file to analyse."
            exit 0
          fi
          echo "Analysing $(echo "$files" | wc -l) file(s) on $(nproc) cores"
          # One clang-tidy per few files, all the cores: a full pass took 34 minutes in a single process.
          echo "$files" | xargs -P "$(nproc)" -n 6 clang-tidy -p build/${{ matrix.preset }} --quiet

      - name: ccache statistics (macOS / Linux)
        if: always() && runner.os != 'Windows'
        run: ccache --show-stats || true

      - name: Upload the tst_controls log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tst-controls-log-${{ runner.os }}
          path: build/${{ matrix.preset }}/tst_controls.log
          if-no-files-found: ignore

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ runner.os }}
          path: |
            ${{ github.workspace }}/.vcpkg-tool/buildtrees/**/*.log
          if-no-files-found: ignore

  # One universal Quarry.app and its .dmg from the two builds (H10 phase 3). Ad-hoc signed: Apple
  # Developer ID signing and notarization need credentials (packaging/macos/sign_and_notarize.sh).
  macos-universal:
    name: macOS universal
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: quarry-app-*
          path: apps
      - name: Join the builds, make the .dmg and test it
        run: |
          set -o pipefail
          mkdir -p work/arm work/x64
          tar -xzf apps/quarry-app-ARM64/quarry-app.tar.gz -C work/arm
          tar -xzf apps/quarry-app-X64/quarry-app.tar.gz -C work/x64
          packaging/macos/make_universal.sh work/arm/Quarry.app work/x64/Quarry.app work/Quarry.app

          # Every Mach-O file must carry both architectures.
          bad=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q 'Mach-O'; then
              archs=$(lipo -archs "$f")
              if [[ "$archs" != *x86_64* || "$archs" != *arm64* ]]; then echo "not universal: $f ($archs)"; bad=1; fi
            fi
          done < <(find work/Quarry.app -type f -print0)
          [ "$bad" = 0 ]

          version=$(sed -n 's/^project(quarry VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          dmg="Quarry-$version-universal.dmg"
          packaging/macos/make_dmg.sh work/Quarry.app "$dmg"
          bytes=$(stat -f %z "$dmg")
          echo "dmg: $((bytes / 1048576)) MB (budget 60 MB)"
          [ "$bytes" -le $((60 * 1048576)) ]

          # Install from the .dmg as a user would, then start the app from there.
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/installed"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$dmg"
          test -L "$RUNNER_TEMP/mnt/Applications"
          ditto "$RUNNER_TEMP/mnt/Quarry.app" "$RUNNER_TEMP/installed/Quarry.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          app="$RUNNER_TEMP/installed/Quarry.app"
          cp work/arm/libqoffscreen.dylib "$app/Contents/PlugIns/platforms/"
          codesign --force --sign - "$app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          mkdir -p "$RUNNER_TEMP/home"
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/quarry" --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Providers available" "$RUNNER_TEMP/smoke.log" || echo "::warning::the bundle did not report its providers"
          # The x86_64 slice through Rosetta, when the runner has it (the Intel job runs it natively).
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen arch -x86_64 "$app/Contents/MacOS/quarry" --smoke
          else
            echo "no Rosetta on this runner: the x86_64 slice is tested by the Intel job"
          fi
          cp work/arm/libqoffscreen.dylib libqoffscreen.dylib

      - uses: actions/upload-artifact@v7
        with:
          name: quarry-macos-dmg
          path: Quarry-*-universal.dmg
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: quarry-macos-test-support
          path: libqoffscreen.dylib
          retention-days: 1

  # The x86_64 slice of the universal bundle, natively on an Intel runner.
  macos-intel-check:
    name: macOS universal on Intel
    needs: [plan, macos-universal]
    if: needs.plan.outputs.full == 'true' && needs.plan.outputs.macos == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: quarry-macos-dmg
          path: dmg
      - uses: actions/download-artifact@v8
        with:
          name: quarry-macos-test-support
          path: support
      - name: Start Quarry from the .dmg
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/mnt" "$RUNNER_TEMP/installed" "$RUNNER_TEMP/home"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" dmg/Quarry-*-universal.dmg
          ditto "$RUNNER_TEMP/mnt/Quarry.app" "$RUNNER_TEMP/installed/Quarry.app"
          hdiutil detach "$RUNNER_TEMP/mnt"
          app="$RUNNER_TEMP/installed/Quarry.app"
          cp support/libqoffscreen.dylib "$app/Contents/PlugIns/platforms/"
          codesign --force --sign - "$app/Contents/PlugIns/platforms/libqoffscreen.dylib"
          uname -m
          env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin QT_QPA_PLATFORM=offscreen "$app/Contents/MacOS/quarry" --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Providers available" "$RUNNER_TEMP/smoke.log" || echo "::warning::the bundle did not report its providers"

  # The local Flatpak bundle (H10 phase 4): it copies the AppDir the Linux job deployed, because the
  # runtime does not have Qt 6.12. Not for Flathub.
  linux-flatpak:
    name: Linux Flatpak
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: quarry-linux-appdir
          path: appdir-download
      - name: Install Flatpak and the runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build the Flatpak
        run: |
          mkdir -p appdir-root
          tar -xzf appdir-download/quarry-appdir.tar.gz -C appdir-root
          version=$(sed -n 's/^project(quarry VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          packaging/linux/build_flatpak.sh appdir-root/usr "$RUNNER_TEMP/flatpak" "$version"
          cp "$RUNNER_TEMP/flatpak/Quarry-$version.flatpak" .
      - name: Install the bundle and start Quarry from it
        run: |
          # The runner restricts unprivileged user namespaces, which the sandbox (bubblewrap) needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak install --user -y --noninteractive --bundle Quarry-*.flatpak
          # The offscreen platform plugin comes from the Qt kit and is not part of the package.
          mkdir -p "$RUNNER_TEMP/qtplug/platforms"
          cp appdir-root/libqoffscreen.so "$RUNNER_TEMP/qtplug/platforms/"
          set -o pipefail
          flatpak run --filesystem="$RUNNER_TEMP/qtplug:ro" --env=QT_PLUGIN_PATH="$RUNNER_TEMP/qtplug" \
            --env=QT_QPA_PLATFORM=offscreen dev.quarry.Quarry --smoke 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -q "Providers available" "$RUNNER_TEMP/smoke.log" || echo "::warning::the Flatpak did not report its providers"
          ls -l Quarry-*.flatpak
      - uses: actions/upload-artifact@v7
        with:
          name: quarry-linux-flatpak
          path: Quarry-*.flatpak
          retention-days: 3

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
