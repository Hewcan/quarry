name: CI

# Pushes and pull requests that only touch documentation do not run CI. A push that mixes
# docs and code does, because GitHub looks at every file of the push.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  # Full run on demand: Actions tab -> CI -> Run workflow, with "full" ticked for a complete
  # clang-tidy pass.
  workflow_dispatch:
    inputs:
      full:
        description: 'Run clang-tidy on every file, not only on the changed ones'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-2022, preset: windows-release, qt_dir: 'C:\Qt' }
          - { name: macOS, os: macos-15, preset: macos-release, qt_dir: '~/Qt' }
          - { name: Linux, os: ubuntu-24.04, preset: linux-release, qt_dir: '~/Qt' }
    env:
      # Own vcpkg checkout: the image's copy may predate vcpkg.json's builtin-baseline.
      # Inside the workspace (gitignored): upload-artifact rejects paths containing '..'.
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-tool
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # clang-tidy diffs against the previous push

      - name: Restore Qt
        uses: actions/cache@v6
        with:
          path: ${{ matrix.qt_dir }}
          key: qt-${{ runner.os }}-${{ hashFiles('.qt-version', 'scripts/requirements-aqt.txt') }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-overlays/**', '.qt-version') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Create vcpkg cache dir
        shell: bash
        run: mkdir -p "${{ github.workspace }}/.vcpkg-cache"

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -NonInteractive -SkipCompiler

      - name: Setup (macOS / Linux)
        if: runner.os != 'Windows'
        run: ./scripts/setup.sh --non-interactive

      - name: Configure, build, test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset ${{ matrix.preset }} -DQUARRY_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset ${{ matrix.preset }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset ${{ matrix.preset }} --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Install a headless keyring (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11

      # PostgreSQL conformance (H1.8). A docker step, not `services:`, because this is a matrix
      # job and service containers only work on Linux runners.
      - name: Start PostgreSQL 17 (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=quarry -e POSTGRES_PASSWORD=quarry             -e POSTGRES_DB=quarry_test postgres:17
          for i in $(seq 1 30); do docker exec pg pg_isready -U quarry -d quarry_test && break; sleep 1; done
          echo "QUARRY_TEST_POSTGRES_URL=postgresql://quarry:quarry@localhost:5432/quarry_test" >> "$GITHUB_ENV"

      # MySQL / MariaDB conformance (H6). MariaDB 11 on port 3306 is the default target of
      # tst_mysql_provider; MySQL 8.4 (caching_sha2_password) on 3307 gets its own run below.
      - name: Start MariaDB 11 and MySQL 8.4 (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name maria -p 3306:3306 -e MARIADB_ROOT_PASSWORD=quarry -e MARIADB_DATABASE=quarry_test mariadb:11
          docker run -d --name mysql84 -p 3307:3306 -e MYSQL_ROOT_PASSWORD=quarry -e MYSQL_DATABASE=quarry_test mysql:8.4
          for i in $(seq 1 90); do docker exec maria mariadb-admin ping -uroot -pquarry --silent && break; sleep 1; done
          for i in $(seq 1 90); do docker exec mysql84 mysqladmin ping -uroot -pquarry --silent && break; sleep 1; done
          echo "QUARRY_TEST_MYSQL_URL=mysql://root:quarry@127.0.0.1:3306/quarry_test" >> "$GITHUB_ENV"

      # ODBC and SQL Server conformance (H7). unixODBC reads odbcinst.ini from /etc through
      # ODBCSYSINI (the vcpkg copy would look under its own prefix). `odbc` runs against the
      # postgres container with psqlodbc; `mssql` against SQL Server 2022 with msodbcsql18.
      - name: Install ODBC drivers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if ! apt-cache show msodbcsql18 >/dev/null 2>&1; then
            curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
          fi
          sudo ACCEPT_EULA=Y apt-get install -y --no-install-recommends unixodbc msodbcsql18 odbc-postgresql
          odbcinst -q -d
          echo "ODBCSYSINI=/etc" >> "$GITHUB_ENV"
          # odbcinst.ini names the drivers by file name (psqlodbcw.so); the vcpkg unixODBC does not
          # search the system ODBC directory by itself.
          echo "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu/odbc" >> "$GITHUB_ENV"
          echo "QUARRY_TEST_ODBC_URL=Driver={PostgreSQL Unicode};Server=127.0.0.1;Port=5432;Database=quarry_test;UID=quarry;PWD=quarry;sslmode=disable" >> "$GITHUB_ENV"

      - name: Start SQL Server 2022 (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name mssql -p 1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e 'MSSQL_SA_PASSWORD=Quarry_Pw1!' mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 120); do docker exec mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Quarry_Pw1!' -Q 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          echo 'QUARRY_TEST_MSSQL_URL=mssql://sa:Quarry_Pw1!@127.0.0.1:1433/master?trustservercertificate=true' >> "$GITHUB_ENV"

      # SSH tunnel tests (H8): the runner's own sshd on port 2222 with password login and TCP
      # forwarding; the tests forward to the PostgreSQL container started above.
      - name: Start sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo useradd -m -s /bin/bash quarry
          echo 'quarry:quarry' | sudo chpasswd
          printf '%s\n' 'Port 2222' 'ListenAddress 127.0.0.1' 'PasswordAuthentication yes' 'AllowTcpForwarding yes' 'PermitOpen any' | sudo tee /etc/ssh/sshd_config.d/00-quarry.conf >/dev/null
          sudo mkdir -p /run/sshd
          # 00-: OpenSSH keeps the first value it reads, and cloud images ship 50-cloud-init.conf with
          # PasswordAuthentication no.
          # Ubuntu 24.04 starts sshd through ssh.socket, which ignores Port: stop it and run sshd directly.
          sudo systemctl stop ssh.socket ssh 2>/dev/null || true
          sudo /usr/sbin/sshd
          up=0
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/2222) 2>/dev/null && up=1 && break; sleep 1; done
          [ "$up" = 1 ] || { echo 'sshd did not open port 2222'; sudo /usr/sbin/sshd -T | head -5; exit 1; }
          echo 'QUARRY_TEST_SSH_URL=ssh://quarry:quarry@127.0.0.1:2222' >> "$GITHUB_ENV"
          echo 'QUARRY_TEST_SSH_TARGET=127.0.0.1:5432' >> "$GITHUB_ENV"

      - name: Configure, build, test (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --preset ${{ matrix.preset }} -DQUARRY_WARNINGS_AS_ERRORS=ON
          cmake --build --preset ${{ matrix.preset }}
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Real Secret Service for the keychain tests: unlocked gnome-keyring in a private D-Bus session.
            dbus-run-session -- bash -c 'echo ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && QUARRY_TEST_KEYCHAIN=1 ctest --preset ${{ matrix.preset }} --output-on-failure'
          else
            ctest --preset ${{ matrix.preset }} --output-on-failure
          fi

      - name: MySQL 8.4 conformance (Linux)
        if: runner.os == 'Linux'
        env:
          QUARRY_TEST_MYSQL_URL: mysql://root:quarry@127.0.0.1:3307/quarry_test
        run: ctest --preset linux-release -R tst_mysql_provider --output-on-failure

      # Only the files changed since the previous push, unless a full run is asked for: manual
      # dispatch with "full", "[full-ci]" in the commit message or PR title,
      # a changed build/analysis setup or more than 40 changed sources (scripts/ci-tidy-files.sh).
      - name: clang-tidy
        if: runner.os == 'Linux'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) || contains(github.event.head_commit.message, '[full-ci]') || contains(github.event.pull_request.title, '[full-ci]') }}
        run: |
          files=$(bash scripts/ci-tidy-files.sh "$BASE_SHA" "$HEAD_SHA" "$FULL")
          if [ -z "$files" ]; then
            echo "No C++ file to analyse."
            exit 0
          fi
          echo "Analysing $(echo "$files" | wc -l) file(s)"
          clang-tidy -p build/${{ matrix.preset }} --quiet $files

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ runner.os }}
          path: |
            ${{ github.workspace }}/.vcpkg-tool/buildtrees/**/*.log
          if-no-files-found: ignore

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git ls-files '*.h' '*.cpp' | xargs clang-format --dry-run --Werror
